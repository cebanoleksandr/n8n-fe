name: Deploy to GitHub Pages

# After CI passes on main, or by hand from the Actions tab.
# Setup: Settings → Pages → Source: GitHub Actions, and the repository
# variable API_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://flow-api.onrender.com/api.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@12.2.0
      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          # Pages serves the app under /<repo>/; set BASE_PATH=/ for a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the repository variable API_URL, e.g. https://flow-api.onrender.com/api"
            exit 1
          fi
          npm run build
          # Pages has no rewrites: unknown paths (deep links) get 404.html,
          # which is the app itself, and the router takes it from there.
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
